<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="神奈川大学 横浜キャンパスの非公式マップ。建物配置、フロア、部屋やトイレなどの設備を確認できます。"
    />
    <title>Uniview | 横浜キャンパスマップ</title>
  </head>
  <body class="theme-light" data-view="floor">
    <header class="top-bar">
      <div class="brand">
        <h1>Uniview</h1>
        <span>横浜キャンパス / 非公式・試作版</span>
      </div>
      <nav class="view-switch" aria-label="表示切り替え">
        <button id="btn-view-campus" aria-pressed="false">キャンパス</button
        ><button id="btn-view-floor" aria-pressed="true">平面図</button
        ><button id="btn-view-3d" aria-pressed="false">立体図</button>
      </nav>
      <div class="top-actions">
        <button id="btn-reset-camera">視点リセット</button
        ><button id="btn-theme-toggle" aria-label="テーマ切り替え">◐</button>
      </div>
    </header>
    <div class="workspace">
      <aside id="sidebar-panel" class="sidebar-panel">
        <section class="panel-section location-section">
          <label for="building-select">建物</label
          ><select id="building-select"></select>
          <p id="building-status" class="muted" aria-live="polite"></p>
          <label id="group-display-option" class="hidden"><input id="show-connected" type="checkbox" checked />
            連絡棟をまとめて表示</label>
          <p id="group-status" class="muted" aria-live="polite"></p>
          <div id="floor-control">
            <div class="control-header">
              <h2>フロア</h2>
              <span id="explode-level-badge" class="badge"></span>
            </div>
            <div id="floor-buttons" class="floor-buttons"></div>
            <div class="three-only">
              <label
                ><input id="show-all-floors" type="checkbox" checked />
                全階を表示</label
              ><label for="explode-slider"
                >階の間隔
                <output id="explode-value" for="explode-slider"
                  >0%</output
                ></label
              ><input
                id="explode-slider"
                type="range"
                min="0"
                max="100"
                value="0"
              />
              <p id="three-display-status" class="muted"></p>
            </div>
          </div>
          <h2 class="gate-heading">門</h2>
          <div
            id="gate-list"
            class="filter-buttons"
            aria-label="キャンパスの門"
          ></div>
        </section>
        <section class="panel-section">
          <h2>ルート案内</h2>
          <div class="route-inputs">
            <div class="input-wrapper">
              <label for="input-start">出発地</label>
              <div class="input-row">
                <input
                  id="input-start"
                  placeholder="部屋・WC・階段など"
                  autocomplete="off"
                  role="combobox"
                  aria-autocomplete="list"
                  aria-controls="suggestions-start"
                  aria-expanded="false"
                /><button
                  id="btn-clear-start"
                  class="hidden"
                  aria-label="出発地クリア"
                >
                  ×</button
                ><button
                  id="btn-pick-start"
                  aria-label="地図で出発地を選ぶ"
                  aria-pressed="false"
                >
                  ⌖
                </button>
              </div>
              <div
                id="suggestions-start"
                class="suggestions-list hidden"
                role="listbox"
                aria-label="出発地の候補"
              ></div>
            </div>
            <button
              id="btn-swap-points"
              class="swap-button"
              aria-label="出発地と目的地を入れ替え"
            >
              ⇅ 入れ替え
            </button>
            <div class="input-wrapper">
              <label for="input-dest">目的地</label>
              <div class="input-row">
                <input
                  id="input-dest"
                  placeholder="例：WC、3-201"
                  autocomplete="off"
                  role="combobox"
                  aria-autocomplete="list"
                  aria-controls="suggestions-dest"
                  aria-expanded="false"
                /><button
                  id="btn-clear-dest"
                  class="hidden"
                  aria-label="目的地クリア"
                >
                  ×</button
                ><button
                  id="btn-pick-dest"
                  aria-label="地図で目的地を選ぶ"
                  aria-pressed="false"
                >
                  ⌖
                </button>
              </div>
              <div
                id="suggestions-dest"
                class="suggestions-list hidden"
                role="listbox"
                aria-label="目的地の候補"
              ></div>
            </div>
          </div>
          <fieldset class="route-filters">
            <legend>移動条件</legend>
            <div class="filter-buttons">
              <button
                class="filter-btn active"
                data-filter="shortest"
                aria-pressed="true"
              >
                標準</button
              ><button
                class="filter-btn"
                data-filter="accessible"
                aria-pressed="false"
              >
                階段を避ける</button
              ><button
                class="filter-btn"
                data-filter="indoor"
                aria-pressed="false"
              >
                屋内優先</button
              ><button
                class="filter-btn"
                data-filter="stairs"
                aria-pressed="false"
              >
                階段優先
              </button>
            </div>
          </fieldset>
          <p class="muted route-policy-note">距離・所要時間は未測定。</p>
          <label class="route-preview-option"
            ><input type="checkbox" id="allow-inferred" checked />
            参考ルートを含む</label
          >
          <p id="route-status" class="route-status hidden" role="status" aria-live="polite"></p>
          <div
            id="route-summary-panel"
            class="route-summary hidden"
            aria-live="polite"
          >
            <p id="route-confidence"></p>
            <dl>
              <div>
                <dt>距離</dt>
                <dd id="summary-distance"></dd>
              </div>
              <div>
                <dt>所要時間</dt>
                <dd id="summary-time"></dd>
              </div>
              <div>
                <dt>階移動</dt>
                <dd id="summary-vertical"></dd>
              </div>
            </dl>
          </div>
        </section>
        <section class="panel-section facilities">
          <h2>このフロアの場所</h2>
          <div
            id="facility-filters"
            class="filter-buttons"
            aria-label="場所の種類"
          ></div>
          <div id="facility-list" class="facility-list"></div>
        </section>
        <details class="panel-section data-notice">
          <summary>マップの登録状況・注意事項</summary>
          <p>
            模式図です。距離・所要時間は未測定。奥の部屋は手前の入口まで案内します。
          </p>
          <p>
            <a href="https://github.com/oz-coden/Uniview/blob/main/docs/survey-notes.md" target="_blank" rel="noopener noreferrer">資料・調査記録</a>
          </p>
          <p>
            階段回避は車椅子での通行可否を保証しません。
          </p>
          <a
            href="https://www.kanagawa-u.ac.jp/aboutus/information/facilities/yokohama/"
            target="_blank"
            rel="noopener noreferrer"
            >大学公式の施設・キャンパスマップ</a
          >
        </details>
        <section class="panel-section" aria-label="利用条件">
          <p>地図の閲覧・場所検索・経路検索は無料で利用できます。</p>
          <p>
            <a href="https://github.com/oz-coden/Uniview/blob/main/LICENSE.md" target="_blank" rel="noopener noreferrer">利用条件</a>
            · <a href="./licenses.txt" target="_blank" rel="noopener noreferrer">既存許諾・第三者ライセンス</a>
          </p>
        </section>
      </aside>
      <main class="map-workspace" aria-label="キャンパスマップ">
        <div id="pick-banner" class="pick-banner hidden" role="status">
          <span id="pick-banner-text"></span
          ><button id="btn-cancel-pick">キャンセル</button>
        </div>
        <div id="map-stage" class="map-stage">
          <section id="map-panel" class="map-panel">
            <div class="map-header">
              <div>
                <h2 id="map-heading"></h2>
                <p id="map-subtitle" class="muted">掲示図に基づく模式図</p>
              </div>
              <div class="map-zoom-controls">
                <button id="map-zoom-out" aria-label="地図を縮小">−</button
                ><button id="map-zoom-in" aria-label="地図を拡大">+</button>
              </div>
            </div>
            <div id="map-canvas" class="map-canvas"></div>
            <p id="map-legend" class="map-legend">
              青：部屋　緑：WC　水色：EV　黄：階段　紫：参考ルート
            </p>
            <p id="map-caption" class="map-caption"></p>
          </section>
          <div
            id="canvas-container"
            class="canvas-container hidden"
            aria-label="建物の立体図"
          ></div>
          <section
            id="room-tooltip"
            class="place-details hidden"
            role="region"
            aria-labelledby="tooltip-title"
            aria-label="選択した場所"
          >
            <div class="place-details-content">
              <div class="control-header">
                <h2 id="tooltip-title"></h2>
                <button id="btn-close-selection" aria-label="場所の選択を解除">
                  ×
                </button>
              </div>
              <p id="tooltip-desc"></p>
              <div class="tooltip-actions">
                <button id="btn-tooltip-set-start">ここから出発</button
                ><button id="btn-tooltip-set-dest" class="primary">
                  ここへ行く
                </button>
              </div>
            </div>
          </section>
        </div>
        <section
          id="step-guide"
          class="step-guide hidden"
          aria-label="道順案内"
        >
          <div class="step-guide-header">
            <h2>道順 <span id="guide-step-count"></span></h2>
            <button id="btn-close-guide" aria-label="道順案内を閉じる">
              ×
            </button>
          </div>
          <div id="step-guide-list" class="step-list"></div>
        </section>
      </main>
    </div>
    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
    <noscript>このマップの表示と経路検索にはJavaScriptが必要です。</noscript>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
